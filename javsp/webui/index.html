<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>JavSP · 影片元数据刮削器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- ========== 侧边栏 ========== -->
    <aside class="sidebar">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2.5"/>
            <path d="M3 9h18M8 4v5M16 4v5"/>
            <circle cx="12" cy="14.5" r="2.5"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>JavSP</h1>
          <p>元数据刮削器</p>
        </div>
        <span class="conn" id="conn" title="未连接"></span>
      </header>

      <!-- 任务总览 -->
      <section class="panel">
        <div class="panel-head">
          <h2>任务</h2>
          <span class="pill idle" id="job-pill">空闲</span>
        </div>

        <div class="progress">
          <div class="progress-track">
            <div class="progress-fill" id="bar"></div>
          </div>
          <span class="progress-label" id="bar-label">0 / 0</span>
        </div>
        <p class="progress-hint" id="job-hint">选择影片目录后开始</p>

        <div class="metrics">
          <div class="metric">
            <span class="metric-value" id="m-total">0</span>
            <span class="metric-name">已识别</span>
          </div>
          <div class="metric">
            <span class="metric-value ok" id="m-done">0</span>
            <span class="metric-name">已完成</span>
          </div>
          <div class="metric">
            <span class="metric-value err" id="m-fail">0</span>
            <span class="metric-name">失败</span>
          </div>
          <div class="metric">
            <span class="metric-value" id="m-time">—</span>
            <span class="metric-name">用时</span>
          </div>
        </div>
      </section>

      <!-- 逐部进度 -->
      <section class="panel grow">
        <div class="panel-head">
          <h2>抓取进度</h2>
          <span class="count" id="movie-count"></span>
        </div>
        <ul class="movies" id="movies">
          <li class="empty">
            <span>尚无进行中的任务</span>
          </li>
        </ul>
      </section>

      <!-- 日志 -->
      <section class="panel logs-panel">
        <div class="panel-head">
          <h2>日志</h2>
          <button class="ghost-btn" id="btn-clear-log" type="button">清空</button>
        </div>
        <ul class="logs" id="logs"></ul>
      </section>
    </aside>

    <!-- ========== 主区域 ========== -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h2 id="page-title">按目录获取</h2>
          <p id="page-sub">选择要刮削的文件夹，先预览识别结果再开始</p>
        </div>
        <div class="topbar-actions">
          <button class="btn ghost" id="btn-stop" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
            停止
          </button>
          <button class="btn primary" id="btn-start" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg>
            <span id="btn-start-label">开始整理</span>
          </button>
        </div>
      </header>

      <!-- 模式切换 -->
      <div class="mode-switch" role="tablist">
        <button class="mode-tab active" id="tab-dir" type="button" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7.5A2 2 0 015 5.5h3.6a2 2 0 011.5.7l.9 1.1H19a2 2 0 012 2v7.2a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          </svg>
          按目录获取
        </button>
        <button class="mode-tab" id="tab-id" type="button" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 10h4M7 14h7"/>
          </svg>
          按番号获取
        </button>
      </div>

      <!-- 输入区：按目录 -->
      <section class="card" id="pane-dir">
        <label class="field">
          <span class="field-label">影片目录</span>
          <div class="field-input">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7.5A2 2 0 015 5.5h3.6a2 2 0 011.5.7l.9 1.1H19a2 2 0 012 2v7.2a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
            </svg>
            <input id="dir-input" type="text" spellcheck="false" autocomplete="off"
                   placeholder="点右侧「浏览…」选择，或直接粘贴绝对路径">
            <button class="btn subtle" id="btn-browse" type="button">浏览…</button>
          </div>
        </label>

        <div class="row-actions">
          <button class="btn ghost" id="btn-scan" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
            扫描预览
          </button>
          <span class="inline-hint" id="scan-hint"></span>
        </div>

        <div class="recent hidden" id="recent">
          <span class="recent-label">最近</span>
          <div class="recent-items" id="recent-items"></div>
        </div>
      </section>

      <!-- 输入区：按番号 -->
      <section class="card hidden" id="pane-id">
        <label class="field">
          <span class="field-label">目标文件夹</span>
          <div class="field-input">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7.5A2 2 0 015 5.5h3.6a2 2 0 011.5.7l.9 1.1H19a2 2 0 012 2v7.2a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
            </svg>
            <input id="target-input" type="text" spellcheck="false" autocomplete="off"
                   placeholder="留空则输出到桌面；也可以先选一个空文件夹">
            <button class="btn subtle" id="btn-browse-target" type="button">浏览…</button>
          </div>
        </label>

        <label class="field mt">
          <span class="field-label">番号</span>
          <textarea id="ids-input" rows="4" spellcheck="false"
                    placeholder="每行一个，或用逗号/空格分隔。例如：&#10;ABP-647&#10;SSIS-001"></textarea>
        </label>

        <div class="row-actions">
          <span class="inline-hint" id="id-hint">
            每个番号会生成 <code>&lt;目标文件夹&gt;/&lt;番号&gt;/</code>，内含 NFO、封面与海报。
          </span>
        </div>
      </section>

      <!-- 预览 -->
      <section class="card grow preview-card">
        <div class="card-head">
          <div>
            <h3 id="preview-title">扫描预览</h3>
            <p id="preview-summary">尚未扫描</p>
          </div>
          <div class="chips" id="preview-chips"></div>
        </div>

        <div class="preview-body" id="preview-body">
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2.5"/>
                <path d="M3 9h18"/>
                <circle cx="12" cy="14.5" r="2.5"/>
              </svg>
            </div>
            <h4>还没有扫描结果</h4>
            <p>先选择影片目录并点「扫描预览」，这里会列出识别到的番号、文件明细，以及需要人工处理的文件。</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toasts" id="toasts"></div>

  <!-- 点击影片文件后，在其下方弹出的元数据气泡 -->
  <div class="popover hidden" id="movie-popover" role="dialog">
    <button class="popover-close" id="popover-close" type="button" title="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="popover-arrow" id="popover-arrow"></div>
    <div class="popover-content" id="popover-content"></div>
  </div>

  <!-- 图片放大查看 -->
  <div class="lightbox hidden" id="lightbox">
    <button class="lb-close" id="lb-close" type="button" title="关闭 (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="lb-nav prev" id="lb-prev" type="button" title="上一张 (←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <img class="lb-img" id="lb-img" alt="">
    <button class="lb-nav next" id="lb-next" type="button" title="下一张 (→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div class="lb-counter" id="lb-counter"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
